name: notiball
description: myFeed - Modo Carreira Mobile
version: 1.1.03+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  flutter_colorpicker: ^1.0.3
  share_plus: ^7.2.1
  google_fonts: ^6.1.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
